services:
  # ParkU FastAPI Web Service on Render Free Tier
  - type: web
    name: parku-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parku-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production

databases:
  # Render Free Managed PostgreSQL Database
  - name: parku-db
    databaseName: parku_db
    user: parku_user
    plan: free
    region: oregon

